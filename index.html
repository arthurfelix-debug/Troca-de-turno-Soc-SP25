<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troca de Turno - Almoxarifado SP25</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --shopee-orange: #EE4D2D;
            --shopee-navy: #113366;
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --border-color: #dddddd;
            --text-main: #333333;
        }

        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: var(--shopee-navy);
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
            border-bottom: 5px solid var(--shopee-orange);
        }

        header h1 { margin: 0; font-size: 24px; text-transform: uppercase; }
        header p { margin: 5px 0 0 0; color: #e2e8f0; }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card-title {
            color: var(--shopee-orange);
            font-size: 18px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .form-grid.two-cols { grid-template-columns: 1fr 1fr; }
            .form-grid.three-cols { grid-template-columns: 1fr 1fr 1fr; }
        }

        .form-group { display: flex; flex-direction: column; }
        
        label { font-weight: 500; margin-bottom: 5px; font-size: 14px; color: #555; }
        
        input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--shopee-orange);
            box-shadow: 0 0 0 2px rgba(238, 77, 45, 0.1);
        }

        textarea { resize: vertical; min-height: 60px; }

        /* Tabela Críticos / Triagem */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; color: var(--shopee-navy); font-size: 13px; }
        td input { width: 100%; text-align: center; border: none; background: transparent; padding: 5px; font-weight: bold; }
        td input:focus { background-color: #fff3e0; outline: none; }

        .btn-generate {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-generate:hover { background-color: #218838; }

        /* Modal Output */
        #outputModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; width: 90%; max-width: 600px; border-radius: 10px; padding: 20px;
            max-height: 90vh; display: flex; flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; color: var(--shopee-navy); font-size: 20px; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        
        #finalText {
            width: 100%; height: 280px; padding: 15px; font-family: monospace; font-size: 14px;
            border: 1px solid #ccc; border-radius: 5px; background: #f8f9fa; resize: none; white-space: pre-wrap;
        }

        .btn-action {
            color: white; border: none; padding: 12px;
            font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px;
        }
        .btn-copy { background-color: var(--shopee-orange); }
        .btn-copy:hover { background-color: #d73a1c; }
        .btn-send { background-color: var(--shopee-navy); }
        .btn-send:hover { background-color: #0d274d; }
    </style>
</head>
<body>

    <header>
        <h1>Formulário de Troca de Turno</h1>
        <p>Almoxarifado SOC-SP25</p>
    </header>

            <div class="form-group">
                <label>Data</label>
                <input type="date" id="dataAtual">
            </div>
            <div class="form-group">
                <label>Turno Operacional</label>
                <select id="turno">
                    <option value="T1">T1</option>
                    <option value="T2">T2</option>
                    <option value="T3">T3</option>
                </select>
            </div>
            <div class="form-group">
                <label>Almoxarife Responsável</label>
                <input type="text" id="almoxarife" placeholder="Nome do Almoxarife">
            </div>
        </div>
    </div>

        <div class="form-grid three-cols">

                <label>NFs Recebidas (Números)</label>
                <textarea id="rec_nfs" placeholder="Ex: 12345, 67890"></textarea>

            <div class="form-group">

                <textarea id="rec_ids" placeholder="Ex: ID00218, RE00003"></textarea>

            <div class="form-group">
                <label>Quantidades Recebidas</label>
                <textarea id="rec_qtds" placeholder="Ex: 500 un, 200 un"></textarea>
            </div>
        </div>
    </div>
